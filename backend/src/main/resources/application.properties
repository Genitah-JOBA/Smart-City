# Base de données
spring.datasource.url=jdbc:postgresql://localhost:5432/City
spring.datasource.username=postgres
spring.datasource.password=1234
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
server.port=8081

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Configuration Email (Gmail SMTP) — identifiants via variables d'environnement
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Frontend URL pour les liens
app.frontend.url=http://localhost:5173

# Taille des requêtes (images encodées dans le JSON du signalement)
server.tomcat.max-swallow-size=20MB
server.tomcat.max-http-form-post-size=20MB
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# Google Maps - géocodage inverse (coordonnées -> quartier/ville)
# Laisser vide pour utiliser OpenStreetMap. Renseigner votre clé pour activer Google.
google.maps.api-key=