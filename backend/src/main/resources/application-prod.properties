# ============================================================
# Profil PRODUCTION (activé via SPRING_PROFILES_ACTIVE=prod)
# Toutes les valeurs sensibles viennent de variables d'environnement.
# ============================================================

# --- Base de données (Supabase Postgres, injectée par variables d'env) ---
# Ex. SPRING_DATASOURCE_URL=jdbc:postgresql://db.xxxx.supabase.co:5432/postgres?sslmode=require
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/City}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- Port : Render fournit la variable PORT (repli 8081 en local) ---
server.port=${PORT:8081}

# --- CORS : origine(s) du frontend autorisée(s) (Vercel en prod) ---
# Ex. APP_CORS_ALLOWED_ORIGINS=https://smartcity.vercel.app,https://*.vercel.app
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# --- Email (Resend) : clé fournie par l'environnement, JAMAIS en dur ---
resend.api.key=${RESEND_API_KEY:}
resend.from.email=${RESEND_FROM_EMAIL:onboarding@resend.dev}

# --- URL publique du frontend (liens dans les emails) ---
app.frontend.url=${APP_FRONTEND_URL:http://localhost}

# --- Tailles de requêtes (images encodées en base64) ---
server.tomcat.max-swallow-size=20MB
server.tomcat.max-http-form-post-size=20MB
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# --- Géocodage Google (vide = fallback OpenStreetMap) ---
google.maps.api-key=${GOOGLE_MAPS_API_KEY:}
