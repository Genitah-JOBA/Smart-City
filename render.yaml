# ============================================================
# Blueprint Render — backend Spring Boot (Docker)
# La base de données est gérée par Supabase (hors Render).
# Render > New > Blueprint, puis renseigner les variables "sync: false".
# ============================================================
services:
  - type: web
    name: smartcity-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/auth/me   # renvoie 401 si non connecté = service vivant
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # --- Supabase (à coller depuis le dashboard Supabase) ---
      - key: SPRING_DATASOURCE_URL
        sync: false   # jdbc:postgresql://db.xxxx.supabase.co:5432/postgres?sslmode=require
      - key: SPRING_DATASOURCE_USERNAME
        sync: false   # postgres
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      # --- CORS : URL du frontend Vercel ---
      - key: APP_CORS_ALLOWED_ORIGINS
        sync: false   # https://votre-projet.vercel.app,https://*.vercel.app
      - key: APP_FRONTEND_URL
        sync: false   # https://votre-projet.vercel.app
      # --- Email (Resend) ---
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: onboarding@resend.dev
      # --- Optionnel ---
      - key: GOOGLE_MAPS_API_KEY
        sync: false
