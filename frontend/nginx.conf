server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Fichiers statiques + fallback SPA (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse-proxy des appels API vers le conteneur backend.
    # Le frontend appelle "/api/..." (VITE_API_URL vide) -> même origine.
    location /api/ {
        proxy_pass http://backend:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Images encodées dans le JSON des signalements
        client_max_body_size 25M;
    }

    # Cache des assets versionnés par Vite
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
